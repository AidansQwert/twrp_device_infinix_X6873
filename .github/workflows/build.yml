name: Build TWRP vendor_boot (X6873)

# Build recovery, then graft only the RECOVERY ramdisk fragment into stock
# vendor_boot so the stock PLATFORM fragment, DTB, and header remain intact.
on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest branch'
        default: 'twrp-12.1'
        type: choice
        options: ['twrp-12.1', 'twrp-14.1']
      stock_vendor_boot_url:
        description: 'URL of the STOCK vendor_boot.img to graft onto'
        default: 'https://gitlab.com/api/v4/projects/85881373/repository/files/vendor_boot.img/raw?ref=X6873-16.2.0.150SP12%28OP003PF001AZ%29'
        type: string
      build_target:
        description: 'Make target'
        default: 'vendorbootimage'
        type: choice
        options: ['vendorbootimage', 'recoveryimage', 'bootimage']

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Reclaim disk space
        run: |
          echo "--- before ---"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/graalvm \
                      /usr/local/share/powershell /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-.*' '^mysql-.*' \
                      '^mongodb-.*' azure-cli google-chrome-stable \
                      firefox powershell || true
          sudo apt-get -qq autoremove -y
          sudo apt-get -qq clean
          echo "--- after ---"; df -h / /mnt

      - name: Add swap
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless android-sdk-libsparse-utils \
            erofs-utils f2fs-tools
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP minimal manifest
        run: |
          sudo mkdir -p /mnt/twrp
          sudo chown -R "$USER:$USER" /mnt/twrp
          cd /mnt/twrp
          git config --global user.name "kaminarich"
          git config --global user.email "kaminarich@users.noreply.github.com"
          git config --global color.ui false
          repo init --depth=1 --no-repo-verify \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${{ inputs.manifest_branch }}"
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle \
            --no-tags --optimized-fetch --prune
          df -h /mnt

      - name: Place device tree
        run: |
          mkdir -p /mnt/twrp/device/infinix/X6873
          rsync -a --delete --exclude='.git' --exclude='.github' \
            "$GITHUB_WORKSPACE/device_tree/" \
            /mnt/twrp/device/infinix/X6873/
          ls -la /mnt/twrp/device/infinix/X6873

      # Pin the vendor payload to an immutable commit. Existing recovery init
      # files are kept; the bundle supplies missing configs plus blobs/libs.
      - name: Stage Trustonic KeyMint vendor payload
        run: |
          set -euo pipefail

          BUNDLE=/tmp/x6873-keymint-bundle
          DEST=/mnt/twrp/device/infinix/X6873/recovery/root/vendor
          BUNDLE_REF=cbb3b582a7b733cf04f20faaabb27503eb87730a

          mkdir -p "$BUNDLE" "$DEST"
          git -C "$BUNDLE" init -q
          git -C "$BUNDLE" remote add origin https://github.com/AidansQwert/Yayaya.git
          git -C "$BUNDLE" fetch --depth=1 origin "$BUNDLE_REF"
          git -C "$BUNDLE" checkout --detach -q FETCH_HEAD

          # Copy the vendor tree from the pinned bundle.
          rsync -a --delete --ignore-existing "$BUNDLE/vendor/" "$DEST/"

          # Fail hard if any trustlet/registry file required by trustonic.rc is missing.
          test -f "$DEST/etc/init/trustonic.rc" || {
            echo "::error::trustonic.rc is missing from staged payload"
            exit 1
          }

          grep -hoE '/vendor/app/mcRegistry/[[:alnum:]]+\.(drbin|tlbin|tabin)' \
            "$DEST/etc/init/trustonic.rc" \
            | sed 's#.*/##' | sort -u > /tmp/required-trustlets

          # The stock trustonic.rc passes many "-r <driver>.drbin" arguments to
          # mcDriverDaemon, but the stock mcRegistry does not ship all of them
          # (e.g. 020b/cmdq, 030b/spi, 0f5eed.../isp). Missing drivers are
          # skipped by the daemon, so they are warnings here, not errors.
          # 020f (utils) is the one driver that must be present.
          test -f "$DEST/app/mcRegistry/020f0000000000000000000000000000.drbin" || {
            echo "::error::020f0000000000000000000000000000.drbin (utils) is missing"
            exit 1
          }

          missing=0
          while IFS= read -r blob; do
            if [ ! -f "$DEST/app/mcRegistry/$blob" ]; then
              case "$blob" in
                *.drbin)
                  echo "::warning::$blob listed in trustonic.rc but not in stock mcRegistry; skipping"
                  missing=$((missing + 1))
                  ;;
                *)
                  echo "::error::Trustonic init requires missing registry file: $blob"
                  exit 1
                  ;;
              esac
            fi
          done < /tmp/required-trustlets
          echo "Skipped $missing driver(s) not present in stock mcRegistry"

          chmod 0755 \
            "$DEST/bin/mcDriverDaemon" \
            "$DEST/bin/hw/android.hardware.gatekeeper-service.trustonic" \
            "$DEST/bin/hw/android.hardware.security.keymint@3.0-service.trustonic" \
            "$DEST/bin/hw/vendor.trustonic.tee@1.1-service"

          echo "Pinned Yayaya payload: $BUNDLE_REF"
          echo "Staged vendor payload:"
          du -sh "$DEST"

      # This kernel repository provides the stock vendor_boot modules.
      - name: Sync prebuilt kernel and modules
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/kaminarich/android_kernel_infinix_X6873.git \
            /mnt/twrp/device/infinix/X6873-kernel
          echo "modules: $(ls /mnt/twrp/device/infinix/X6873-kernel/modules/*.ko | wc -l)"
          wc -l \
            /mnt/twrp/device/infinix/X6873-kernel/modules/vendor_ramdisk.modules.load \
            /mnt/twrp/device/infinix/X6873-kernel/modules/vendor_ramdisk.modules.load.recovery

      - name: Stage recovery-fragment modules (delta only)
        run: |
          KSRC=/mnt/twrp/device/infinix/X6873-kernel/modules
          DEST=/mnt/twrp/device/infinix/X6873/recovery/root/lib/modules
          mkdir -p "$DEST"

          for m in focaltech_ft3683g adaptive-ts haptic_drv_hv aw86224_light; do
            cp -v "$KSRC/$m.ko" "$DEST/"
          done

          cat "$KSRC/vendor_ramdisk.modules.load.recovery" \
            | grep -vE '^(focaltech_ft3683g|adaptive-ts|haptic_drv_hv|aw86224_light)\.ko$' \
            > /tmp/loadbase
          printf 'adaptive-ts.ko\nfocaltech_ft3683g.ko\nhaptic_drv_hv.ko\naw86224_light.ko\n' \
            >> /tmp/loadbase
          cp /tmp/loadbase "$DEST/modules.load.recovery"

          echo "Modules staged: $(ls "$DEST"/*.ko | wc -l)"
          echo "Recovery module entries: $(wc -l < "$DEST/modules.load.recovery")"

      - name: Diagnose device config
        run: |
          cd /mnt/twrp
          set +e
          source build/envsetup.sh >/dev/null 2>&1
          lunch twrp_X6873-eng >/dev/null 2>&1
          {
            echo "### device tree present?"
            ls -la device/infinix/X6873/BoardConfig.mk
            grep -n "TW_THEME\|TARGET_SCREEN_WIDTH\|TARGET_SCREEN_HEIGHT" \
              device/infinix/X6873/BoardConfig.mk
            echo
            echo "### resolved build variables"
            for v in TARGET_PRODUCT INTERNAL_PRODUCT TARGET_DEVICE \
                     TARGET_DEVICE_DIR TW_THEME TARGET_SCREEN_WIDTH \
                     TARGET_SCREEN_HEIGHT TARGET_RECOVERY_PIXEL_FORMAT \
                     PLATFORM_VERSION; do
              printf '%-32s = %s\n' "$v" "$(get_build_var "$v" 2>/dev/null)"
            done
            echo
            echo "### TWRP config files"
            ls -la vendor/twrp/config/BoardConfigSoong.mk \
                   vendor/twrp/config/BoardConfigTWRP.mk 2>&1
            echo
            echo "### TWRP Soong namespace"
            grep -iA6 '"twrpVarsPlugin"' out/soong/soong.variables \
              2>/dev/null | head -30 || echo "(no soong.variables yet)"
          } 2>&1 | tee "$HOME/config-debug.log"
          cat "$HOME/config-debug.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        run: |
          cd /mnt/twrp
          set +e
          set -o pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh

          lunch twrp_X6873-eng > "$HOME/lunch.log" 2>&1
          cat "$HOME/lunch.log"

          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-<unset>}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-<unset>}"
          if [ "$TARGET_PRODUCT" != "twrp_X6873" ]; then
            echo "::error::lunch did not take effect (TARGET_PRODUCT='${TARGET_PRODUCT}'). Refusing to build."
            exit 1
          fi

          # The final image uses the stock PLATFORM fragment; this directory
          # only satisfies the vendor_boot build's intermediate packaging step.
          mkdir -p out/target/product/X6873/vendor_ramdisk

          mka "${{ inputs.build_target }}" -j"$(nproc --all)" \
            2>&1 | tee "$HOME/build.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summarise errors
        if: always()
        run: |
          echo "## Build log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 "$HOME/build.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Distinct errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE '^(FAILED|error:|ninja: error|make: \*\*\*)| error: ' \
            "$HOME/build.log" 2>/dev/null \
            | sed 's/^[[:space:]]*//' | sort -u | head -n 40 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          ls -la /mnt/twrp/out/target/product/X6873/*.img 2>/dev/null \
            || echo "no images produced"

      - name: Graft recovery fragment into stock vendor_boot
        if: always()
        run: |
          OUT=/mnt/twrp/out/target/product/X6873
          RAMDISK=""

          for c in "$OUT/ramdisk-recovery.img" "$OUT/ramdisk-recovery.cpio.lz4"; do
            if [ -f "$c" ]; then
              RAMDISK="$c"
              break
            fi
          done

          if [ -z "$RAMDISK" ] && [ -f "$OUT/vendor_boot.img" ]; then
            python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
              unpack "$OUT/vendor_boot.img" "$HOME/built_frags"
            RAMDISK=$(ls "$HOME"/built_frags/vendor_ramdisk_*recovery \
              2>/dev/null | head -1)
            [ -z "$RAMDISK" ] && RAMDISK=$(ls "$HOME"/built_frags/vendor_ramdisk_* \
              2>/dev/null | head -1)
          fi

          if [ -z "$RAMDISK" ]; then
            echo "No recovery ramdisk was produced; nothing to graft." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Using recovery ramdisk: $RAMDISK ($(stat -c%s "$RAMDISK") bytes)"
          curl -fsSL --retry 3 -o "$HOME/stock_vendor_boot.img" \
            "${{ inputs.stock_vendor_boot_url }}"
          echo "Stock image: $(stat -c%s "$HOME/stock_vendor_boot.img") bytes"
          sha256sum "$HOME/stock_vendor_boot.img"

          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            selftest "$HOME/stock_vendor_boot.img" | tee "$HOME/selftest.log"

          mkdir -p "$HOME/artifact"
          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            graft "$HOME/stock_vendor_boot.img" "$RAMDISK" \
            "$HOME/artifact/vendor_boot-twrp-X6873.img" | tee "$HOME/graft.log"

          cp "$OUT/vendor_boot.img" \
            "$HOME/artifact/vendor_boot-RAW-DO-NOT-FLASH.img" 2>/dev/null || true
          cd "$HOME/artifact"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## Grafted image"
            echo '```'
            cat "$HOME/graft.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p upload/logs
          cp -v "$HOME"/artifact/* upload/ 2>/dev/null || true

          for f in build.log lunch.log graft.log selftest.log \
                   config-debug.log built_vendor_boot_info.log; do
            cp -v "$HOME/$f" upload/logs/ 2>/dev/null || true
          done

          [ -f upload/logs/build.log ] && gzip -f upload/logs/build.log || true
          find upload -type f -printf '%p  %s bytes\n' || echo "(nothing staged)"
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X6873-vendor_boot-twrp
          path: upload/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload image to pixeldrain
        if: always()
        env:
          PIXELDRAIN_KEY: ${{ secrets.PIXELDRAIN_KEY }}
        run: bash "$GITHUB_WORKSPACE/device_tree/tools/pixeldrain_upload.sh"

      - name: Report to Telegram
        if: always()
        continue-on-error: true
        env:
          TG_BOT: ${{ secrets.TG_BOT || vars.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT || vars.TG_CHAT }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "TG_BOT / TG_CHAT not configured; skipping Telegram report."
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/device_tree/tools/tg_report.sh"
