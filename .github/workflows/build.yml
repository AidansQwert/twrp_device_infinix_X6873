name: Build TWRP vendor_boot (X6873)

# Build recovery, then graft only the RECOVERY ramdisk fragment into stock
# vendor_boot so the stock PLATFORM fragment, DTB, and header remain intact.
on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest branch (twrp-14.1 is required for AIDL KeyMint / /data decryption)'
        default: 'twrp-14.1'
        type: choice
        options: ['twrp-14.1', 'twrp-12.1']
      stock_vendor_boot_url:
        description: 'URL of the STOCK vendor_boot.img to graft onto (raw file; default is XOS 16.3.0.150)'
        default: 'https://raw.githubusercontent.com/AidansQwert/Vendor/main/vendor_boot.img'
        type: string
      tee_stack_url:
        description: 'Optional .tgz of the phone''s own keymint/gatekeeper service + .so to overlay on the pinned payload (raw URL)'
        default: ''
        type: string
      build_target:
        description: 'Make target'
        default: 'vendorbootimage'
        type: choice
        options: ['vendorbootimage', 'recoveryimage', 'bootimage']

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Reclaim disk space
        run: |
          echo "--- before ---"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/graalvm \
                      /usr/local/share/powershell /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-.*' '^mysql-.*' \
                      '^mongodb-.*' azure-cli google-chrome-stable \
                      firefox powershell || true
          sudo apt-get -qq autoremove -y
          sudo apt-get -qq clean
          echo "--- after ---"; df -h / /mnt

      - name: Add swap
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless android-sdk-libsparse-utils \
            erofs-utils f2fs-tools
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP minimal manifest
        run: |
          sudo mkdir -p /mnt/twrp
          sudo chown -R "$USER:$USER" /mnt/twrp
          cd /mnt/twrp
          git config --global user.name "kaminarich"
          git config --global user.email "kaminarich@users.noreply.github.com"
          git config --global color.ui false
          repo init --depth=1 --no-repo-verify \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${{ inputs.manifest_branch }}"
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle \
            --no-tags --optimized-fetch --prune
          df -h /mnt

      - name: Place device tree
        run: |
          mkdir -p /mnt/twrp/device/infinix/X6873
          rsync -a --delete --exclude='.git' --exclude='.github' \
            "$GITHUB_WORKSPACE/device_tree/" \
            /mnt/twrp/device/infinix/X6873/
          ls -la /mnt/twrp/device/infinix/X6873

      # Pin the vendor payload to an immutable commit. Existing recovery init
      # files are kept; the bundle supplies missing configs plus blobs/libs.
      - name: Stage Trustonic KeyMint vendor payload
        run: |
          set -euo pipefail

          BUNDLE=/tmp/x6873-keymint-bundle
          DEST=/mnt/twrp/device/infinix/X6873/recovery/root/vendor
          BUNDLE_REF=cbb3b582a7b733cf04f20faaabb27503eb87730a

          mkdir -p "$BUNDLE" "$DEST"
          git -C "$BUNDLE" init -q
          git -C "$BUNDLE" remote add origin https://github.com/AidansQwert/Yayaya.git
          git -C "$BUNDLE" fetch --depth=1 origin "$BUNDLE_REF"
          git -C "$BUNDLE" checkout --detach -q FETCH_HEAD

          # Copy the vendor tree from the pinned bundle.
          # .tabin files are NOT referenced by trustonic.rc (only .drbin is
          # loaded via "-r"), and some of them are 5-12 MB each. Including
          # them in the recovery ramdisk fragment is what pushed the built
          # vendor_boot.img past the 64 MiB partition size
          # (71905280 > 67108864). They are codec/DRM trustlets unrelated to
          # KeyMint/gatekeeper, so they are excluded here.
          rsync -a --delete --ignore-existing \
            --exclude='app/mcRegistry/*.tabin' \
            "$BUNDLE/vendor/" "$DEST/"

          # Fail hard if any trustlet/registry file required by trustonic.rc is missing.
          test -f "$DEST/etc/init/trustonic.rc" || {
            echo "::error::trustonic.rc is missing from staged payload"
            exit 1
          }

          grep -hoE '/vendor/app/mcRegistry/[[:alnum:]]+\.(drbin|tlbin|tabin)' \
            "$DEST/etc/init/trustonic.rc" \
            | sed 's#.*/##' | sort -u > /tmp/required-trustlets

          # The stock trustonic.rc passes many "-r <driver>.drbin" arguments to
          # mcDriverDaemon, but the stock mcRegistry does not ship all of them
          # (e.g. 020b/cmdq, 030b/spi, 0f5eed.../isp). Missing drivers are
          # skipped by the daemon, so they are warnings here, not errors.
          # 020f (utils) is the one driver that must be present.
          test -f "$DEST/app/mcRegistry/020f0000000000000000000000000000.drbin" || {
            echo "::error::020f0000000000000000000000000000.drbin (utils) is missing"
            exit 1
          }

          missing=0
          while IFS= read -r blob; do
            if [ ! -f "$DEST/app/mcRegistry/$blob" ]; then
              case "$blob" in
                *.drbin)
                  echo "::warning::$blob listed in trustonic.rc but not in stock mcRegistry; skipping"
                  missing=$((missing + 1))
                  ;;
                *)
                  echo "::error::Trustonic init requires missing registry file: $blob"
                  exit 1
                  ;;
              esac
            fi
          done < /tmp/required-trustlets
          echo "Skipped $missing driver(s) not present in stock mcRegistry"

          chmod 0755 \
            "$DEST/bin/mcDriverDaemon" \
            "$DEST/bin/hw/android.hardware.gatekeeper-service.trustonic" \
            "$DEST/bin/hw/android.hardware.security.keymint@3.0-service.trustonic" \
            "$DEST/bin/hw/vendor.trustonic.tee@1.1-service"

          echo "Pinned Yayaya payload: $BUNDLE_REF"
          echo "Staged vendor payload:"
          du -sh "$DEST"

      # No modules are staged into the device tree any more.
      #
      # The graft keeps the stock PLATFORM fragment, and that fragment already
      # ships the firmware's own module set plus modules.load and
      # modules.load.recovery, all built against the exact running kernel:
      #   XOS 16.2.0.145SP03: 241 .ko, vermagic 6.1.145-android14-11-gbd2a8237408e
      #   XOS 16.3.0.150    : 244 .ko, vermagic 6.1.157-android14-11-g96f885be21ae
      # Pulling modules from the lineage-24.0 kernel repository (6.1.145) is what
      # broke 16.3: a 6.1.157 kernel refuses every one of them, so recovery loses
      # display and input. Whatever image is grafted is therefore also the module
      # source of truth.
      # The Yayaya payload is a complete TEE stack, but it was dumped from an
      # earlier firmware. Overlaying the binaries and libs taken from the phone's
      # own 16.3 odm/vendor directories keeps the HAL byte-identical to the
      # system that wrote the key blobs. Optional: leave the input empty to use
      # the pinned payload as-is.
      - name: Overlay KeyMint/gatekeeper stack from the phone (optional)
        if: inputs.tee_stack_url != ''
        run: |
          set -euo pipefail
          DEST=/mnt/twrp/device/infinix/X6873/recovery/root/vendor
          URL="${{ inputs.tee_stack_url }}"
          case "$URL" in
            https://github.com/*/blob/*)
              URL=$(printf '%s' "$URL" | sed -E \
                's#^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$#https://raw.githubusercontent.com/\1/\2/\3#')
              ;;
          esac
          curl -fsSL --retry 3 -o "$HOME/tee-stack.tgz" "$URL"
          echo "stack: $(stat -c%s "$HOME/tee-stack.tgz") bytes"
          mkdir -p "$HOME/tee-stack" "$DEST/bin/hw" "$DEST/lib64" "$DEST/etc/init"
          tar xzf "$HOME/tee-stack.tgz" -C "$HOME/tee-stack"

          # The tarball may be flat; file names decide the destination.
          while IFS= read -r f; do
            base=$(basename "$f")
            case "$base" in
              *.so)
                install -m 0644 "$f" "$DEST/lib64/$base"
                echo "lib64/$base"
                ;;
              *.rc)
                install -m 0644 "$f" "$DEST/etc/init/$base"
                echo "etc/init/$base"
                ;;
              android.hardware.security.keymint*|android.hardware.gatekeeper-service.trustonic|vendor.trustonic.tee@*)
                install -m 0755 "$f" "$DEST/bin/hw/$base"
                echo "bin/hw/$base"
                ;;
              *)
                echo "::warning::ignoring $base (unrecognised)"
                ;;
            esac
          done < <(find "$HOME/tee-stack" -type f -not -name '*.tgz')

          ls -l "$DEST/bin/hw"
          ls -l "$DEST/lib64" | grep -iE 'keymint|gatekeeper|keymaster|McClient|tee' || true

      # libtar (bootable/recovery/libtar/Android.mk) lists
      # android.security.apc-ndk_platform among its shared libraries whenever
      # TW_INCLUDE_CRYPTO_FBE is true, but nothing in the twrp-14.1 manifest
      # defines that module any more:
      #   FAILED: ninja: .../android.security.apc-ndk_platform.so.toc, needed by
      #   .../libtar.so, missing and no known rule to make it
      # libtar's own sources never reference APC (no apc/confirmation symbol in
      # any .c), so the entry is stale. Drop it only when the module really is
      # undefined, so this stays a no-op on manifests that still ship it.
      - name: Patch stale libtar dependency (android.security.apc)
        run: |
          set -euo pipefail
          cd /mnt/twrp
          LIBTAR=bootable/recovery/libtar/Android.mk
          if [ ! -f "$LIBTAR" ]; then
            echo "$LIBTAR not present; nothing to patch"
            exit 0
          fi
          if grep -rqs 'android.security.apc' --include='*.bp' --include='*.mk' hardware system frameworks vendor 2>/dev/null; then
            echo "android.security.apc is defined in this manifest; leaving libtar alone"
          else
            sed -i '/android\.security\.apc-ndk_platform/d' "$LIBTAR"
            echo "Removed the undefined android.security.apc-ndk_platform from $LIBTAR"
            grep -n 'android.security' "$LIBTAR" | head -5 || true
          fi

      - name: Fetch and validate stock vendor_boot
        run: |
          set -euo pipefail
          URL="${{ inputs.stock_vendor_boot_url }}"
          URL="${URL#${URL%%[![:space:]]*}}"
          URL="${URL%${URL##*[![:space:]]}}"

          # A GitHub blob/tree URL (or a GitLab web page) returns HTML, which is
          # exactly the 'not a vendor_boot image (bad magic)' failure from the
          # earlier run. Rewrite the GitHub form to the raw file URL.
          case "$URL" in
            https://github.com/*/blob/*)
              URL=$(printf '%s' "$URL" | sed -E \
                's#^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$#https://raw.githubusercontent.com/\1/\2/\3#')
              ;;
          esac
          echo "Stock vendor_boot URL: $URL"

          curl -fsSL --retry 3 --retry-delay 5 -o "$HOME/stock_vendor_boot.img" "$URL"
          size=$(stat -c%s "$HOME/stock_vendor_boot.img")
          echo "Downloaded $size bytes"

          if [ "$size" -lt 1048576 ]; then
            echo "::error::stock vendor_boot is only $size bytes; the URL returned an error page, not an image"
            od -c -N 64 "$HOME/stock_vendor_boot.img" || true
            exit 1
          fi

          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            info "$HOME/stock_vendor_boot.img" | tee "$HOME/stock_vendor_boot_info.log"

          echo "STOCK_IMG=$HOME/stock_vendor_boot.img" >> "$GITHUB_ENV"

      - name: Diagnose device config
        run: |
          cd /mnt/twrp
          set +e
          source build/envsetup.sh >/dev/null 2>&1
          lunch twrp_X6873-eng >/dev/null 2>&1
          {
            echo "### device tree present?"
            ls -la device/infinix/X6873/BoardConfig.mk
            grep -n "TW_THEME\|TARGET_SCREEN_WIDTH\|TARGET_SCREEN_HEIGHT" \
              device/infinix/X6873/BoardConfig.mk
            echo
            echo "### resolved build variables"
            for v in TARGET_PRODUCT INTERNAL_PRODUCT TARGET_DEVICE \
                     TARGET_DEVICE_DIR TW_THEME TARGET_SCREEN_WIDTH \
                     TARGET_SCREEN_HEIGHT TARGET_RECOVERY_PIXEL_FORMAT \
                     PLATFORM_VERSION; do
              printf '%-32s = %s\n' "$v" "$(get_build_var "$v" 2>/dev/null)"
            done
            echo
            echo "### TWRP config files"
            ls -la vendor/twrp/config/BoardConfigSoong.mk \
                   vendor/twrp/config/BoardConfigTWRP.mk 2>&1
            echo
            echo "### TWRP Soong namespace"
            grep -iA6 '"twrpVarsPlugin"' out/soong/soong.variables \
              2>/dev/null | head -30 || echo "(no soong.variables yet)"
          } 2>&1 | tee "$HOME/config-debug.log"
          cat "$HOME/config-debug.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        run: |
          cd /mnt/twrp
          set +e
          set -o pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh

          # AOSP 14 (QPR2 onwards, so twrp-14.1) changed the legacy lunch
          # parser: "twrp_X6873-eng" is now split as product=twrp_X6873,
          # release=eng, variant='' and rejected with
          #   Invalid lunch combo: twrp_X6873-eng
          # while twrp-12.1 accepts it. Try each accepted form in order so one
          # workflow builds both branches.
          : > "$HOME/lunch.log"
          if lunch twrp_X6873-eng >> "$HOME/lunch.log" 2>&1; then
            echo "lunch: twrp-12.1 two-part form accepted"
          else
            # TWRP's android-14.1 envsetup.sh always splits on '-' and rejects
            # anything that is not <product>-<release>-<variant>: both
            # 'twrp_X6873-eng' and 'twrp_X6873' fail there. The release name is
            # per-manifest (ap3a, ap4a, trunk_staging, ...), so ask the build
            # system instead of hardcoding it: a dummy release makes
            # check_product print the valid ones.
            lunch twrp_X6873-probe-eng >> "$HOME/lunch.log" 2>&1 || true
            rels=$(grep -oE 'Available releases are:.*' "$HOME/lunch.log" \
                   | tail -1 | sed 's/.*are: //' | tr ',' ' ' | tr -s ' ')
            echo "lunch: releases reported as '${rels:-<none>}'"
            for rel in $rels trunk_staging ap4a ap3a ap2a ap1a; do
              if lunch "twrp_X6873-$rel-eng" >> "$HOME/lunch.log" 2>&1; then
                echo "lunch: accepted twrp_X6873-$rel-eng"
                break
              fi
            done
          fi
          cat "$HOME/lunch.log"

          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-<unset>}"
          echo "TARGET_RELEASE=${TARGET_RELEASE:-<unset>}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-<unset>}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-<unset>}"
          if [ "$TARGET_PRODUCT" != "twrp_X6873" ]; then
            echo "::error::lunch did not take effect (TARGET_PRODUCT='${TARGET_PRODUCT}'). Refusing to build."
            exit 1
          fi

          # The final image uses the stock PLATFORM fragment; this directory
          # only satisfies the vendor_boot build's intermediate packaging step.
          mkdir -p out/target/product/X6873/vendor_ramdisk

          mka "${{ inputs.build_target }}" -j"$(nproc --all)" \
            2>&1 | tee "$HOME/build.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summarise errors
        if: always()
        run: |
          echo "## Build log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 "$HOME/build.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Distinct errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE '^(FAILED|error:|ninja: error|make: \*\*\*)| error: ' \
            "$HOME/build.log" 2>/dev/null \
            | sed 's/^[[:space:]]*//' | sort -u | head -n 40 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          ls -la /mnt/twrp/out/target/product/X6873/*.img 2>/dev/null \
            || echo "no images produced"

      - name: Graft recovery fragment into stock vendor_boot
        if: always()
        run: |
          OUT=/mnt/twrp/out/target/product/X6873
          RAMDISK=""

          for c in "$OUT/ramdisk-recovery.img" "$OUT/ramdisk-recovery.cpio.lz4"; do
            if [ -f "$c" ]; then
              RAMDISK="$c"
              break
            fi
          done

          if [ -z "$RAMDISK" ] && [ -f "$OUT/vendor_boot.img" ]; then
            python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
              unpack "$OUT/vendor_boot.img" "$HOME/built_frags"
            RAMDISK=$(ls "$HOME"/built_frags/vendor_ramdisk_*recovery \
              2>/dev/null | head -1)
            [ -z "$RAMDISK" ] && RAMDISK=$(ls "$HOME"/built_frags/vendor_ramdisk_* \
              2>/dev/null | head -1)
          fi

          if [ -z "$RAMDISK" ]; then
            echo "No recovery ramdisk was produced; nothing to graft." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set -euo pipefail
          STOCK="${STOCK_IMG:-$HOME/stock_vendor_boot.img}"
          echo "Using recovery ramdisk: $RAMDISK ($(stat -c%s "$RAMDISK") bytes)"
          echo "Using stock image: $STOCK ($(stat -c%s "$STOCK") bytes)"
          sha256sum "$STOCK"

          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            selftest "$STOCK" | tee "$HOME/selftest.log"

          mkdir -p "$HOME/artifact"
          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            graft "$STOCK" "$RAMDISK" \
            "$HOME/artifact/vendor_boot-twrp-X6873.img" | tee "$HOME/graft.log"

          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            info "$OUT/vendor_boot.img" > "$HOME/built_vendor_boot_info.log" 2>/dev/null || true

          cp "$OUT/vendor_boot.img" \
            "$HOME/artifact/vendor_boot-RAW-DO-NOT-FLASH.img" 2>/dev/null || true
          cd "$HOME/artifact"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## Grafted image"
            echo '```'
            cat "$HOME/graft.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p upload/logs
          cp -v "$HOME"/artifact/* upload/ 2>/dev/null || true

          for f in build.log lunch.log graft.log selftest.log \
                   config-debug.log built_vendor_boot_info.log \
                   stock_vendor_boot_info.log; do
            cp -v "$HOME/$f" upload/logs/ 2>/dev/null || true
          done

          [ -f upload/logs/build.log ] && gzip -f upload/logs/build.log || true
          find upload -type f -printf '%p  %s bytes\n' || echo "(nothing staged)"
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X6873-vendor_boot-twrp
          path: upload/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload image to pixeldrain
        if: always()
        env:
          PIXELDRAIN_KEY: ${{ secrets.PIXELDRAIN_KEY }}
        run: bash "$GITHUB_WORKSPACE/device_tree/tools/pixeldrain_upload.sh"

      - name: Report to Telegram
        if: always()
        continue-on-error: true
        env:
          TG_BOT: ${{ secrets.TG_BOT || vars.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT || vars.TG_CHAT }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "TG_BOT / TG_CHAT not configured; skipping Telegram report."
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/device_tree/tools/tg_report.sh"
