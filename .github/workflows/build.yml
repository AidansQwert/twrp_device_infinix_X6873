name: Build TWRP vendor_boot (X6873)

# Produces a FLASHABLE vendor_boot.img for the Infinix GT 30 Pro (X6873).
#
# Why this workflow does more than "mka vendorbootimage":
#
# Stock vendor_boot.img on this device holds TWO ramdisk fragments --
# PLATFORM (~29 MB, the normal-boot vendor ramdisk with all 241 kernel
# modules) and RECOVERY (~3 MB). A recovery build emits a vendor_boot.img
# containing only its own ramdisk. Flashing that wipes the PLATFORM fragment,
# the device loses the modules it needs to mount super, and it bootloops with
# no way to recover -- recovery lived in the partition that was just
# overwritten. That is the failure reported on the 145 and 150 builds.
#
# So we build the recovery ramdisk, then graft it into the STOCK image as the
# RECOVERY fragment, leaving PLATFORM, the DTB and every header field
# byte-identical.

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest branch'
        default: 'twrp-12.1'
        type: choice
        options: ['twrp-12.1', 'twrp-14.1']
      stock_vendor_boot_url:
        description: 'URL of the STOCK vendor_boot.img to graft onto'
        default: 'https://gitlab.com/api/v4/projects/85881373/repository/files/vendor_boot.img/raw?ref=X6873-16.2.0.150SP12%28OP003PF001AZ%29'
        type: string
      build_target:
        description: 'Make target'
        default: 'vendorbootimage'
        type: choice
        options: ['vendorbootimage', 'recoveryimage', 'bootimage']

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # ------------------------------------------------------------ disk
      # A TWRP minimal manifest sync plus out/ needs far more than the ~14 GB
      # free on /. Reclaim the preinstalled toolchains and use /mnt, which has
      # the bulk of the runner's disk.
      - name: Reclaim disk space
        run: |
          echo "--- before ---"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/graalvm \
                      /usr/local/share/powershell /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-.*' '^mysql-.*' \
                      '^mongodb-.*' azure-cli google-chrome-stable \
                      firefox powershell || true
          sudo apt-get -qq autoremove -y; sudo apt-get -qq clean
          echo "--- after ---"; df -h / /mnt

      - name: Add swap
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless android-sdk-libsparse-utils \
            erofs-utils f2fs-tools
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # ------------------------------------------------------------ source
      - name: Sync TWRP minimal manifest
        run: |
          sudo mkdir -p /mnt/twrp
          sudo chown -R "$USER:$USER" /mnt/twrp
          cd /mnt/twrp
          git config --global user.name "kaminarich"
          git config --global user.email "kaminarich@users.noreply.github.com"
          git config --global color.ui false
          repo init --depth=1 --no-repo-verify \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ inputs.manifest_branch }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          df -h /mnt

      - name: Place device tree
        run: |
          mkdir -p /mnt/twrp/device/infinix/X6873
          rsync -a --delete --exclude='.git' --exclude='.github' \
            "$GITHUB_WORKSPACE/device_tree/" /mnt/twrp/device/infinix/X6873/
          ls -la /mnt/twrp/device/infinix/X6873

      # The prebuilt kernel repo supplies the stock vendor_boot modules that
      # populate the PLATFORM fragment. It must sit at $(DEVICE_PATH)-kernel,
      # never at kernel/infinix/X6873, which is LineageOS/TWRP's auto-kdir.
      - name: Sync prebuilt kernel and modules
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/kaminarich/android_kernel_infinix_X6873.git \
            /mnt/twrp/device/infinix/X6873-kernel
          echo "modules: $(ls /mnt/twrp/device/infinix/X6873-kernel/modules/*.ko | wc -l)"
          wc -l /mnt/twrp/device/infinix/X6873-kernel/modules/vendor_ramdisk.modules.load \
                /mnt/twrp/device/infinix/X6873-kernel/modules/vendor_ramdisk.modules.load.recovery

      # ------------------------------------------------------- diagnostics
      # Run #1 failed with "Could not find ui.xml for TW_THEME: not set" even
      # though BoardConfig.mk sets TW_THEME. TWRP forwards TW_* into the soong
      # namespace twrpVarsPlugin via vendor/twrp/config/BoardConfigSoong.mk,
      # so prove whether kati sees the variable at all.
      # Stage ONLY the modules the stock PLATFORM fragment does not carry.
      #
      # Run #11 failed the graft size check by 4.6 MB:
      #   ERROR: result is 71733248 bytes, larger than the 67108864 byte
      #   vendor_boot partition
      # because it staged all 245 modules into the RECOVERY fragment while the
      # graft PRESERVES the stock PLATFORM fragment -- which already contains
      # the 241 vendor_boot modules. Everything except the four odm_dlkm
      # additions was therefore duplicated, and 28 MB + 28 MB + TWRP does not
      # fit in 64 MiB.
      #
      # The idabgsram tree ships all 245 because it REPLACES the whole
      # vendor_boot, so nothing is duplicated. Our graft keeps stock PLATFORM,
      # so it needs only the delta.
      - name: Stage recovery-fragment modules (delta only)
        run: |
          KSRC=/mnt/twrp/device/infinix/X6873-kernel/modules
          DEST=/mnt/twrp/device/infinix/X6873/recovery/root/lib/modules
          mkdir -p "$DEST"
          # The four modules stock keeps in odm_dlkm, which the vendor_boot
          # PLATFORM fragment does not carry: touch controller, Transsion
          # touch abstraction, and two haptics drivers.
          for m in focaltech_ft3683g adaptive-ts haptic_drv_hv aw86224_light; do
            cp -v "$KSRC/$m.ko" "$DEST/"
          done
          # Load list: stock recovery order + the four, appended in the order
          # idabgsram's working tree uses. The stock list itself comes from the
          # platform fragment, which already contains it -- copying it here as
          # well would be harmless (later fragment wins) but is unnecessary.
          cat "$KSRC"/vendor_ramdisk.modules.load.recovery \
            | grep -vE '^(focaltech_ft3683g|adaptive-ts|haptic_drv_hv|aw86224_light)\.ko$' > /tmp/loadbase
          printf 'adaptive-ts.ko\nfocaltech_ft3683g.ko\nhaptic_drv_hv.ko\naw86224_light.ko\n' >> /tmp/loadbase
          cp /tmp/loadbase "$DEST"/modules.load.recovery
          echo "modules staged : $(ls "$DEST"/*.ko | wc -l) (delta only)"
          echo "load.recovery  : $(wc -l < "$DEST"/modules.load.recovery) entries"
          tail -5 "$DEST"/modules.load.recovery

      - name: Diagnose device config
        run: |
          cd /mnt/twrp
          set +e
          source build/envsetup.sh >/dev/null 2>&1
          lunch twrp_X6873-eng >/dev/null 2>&1
          {
            echo "### device tree present?"
            ls -la device/infinix/X6873/BoardConfig.mk
            grep -n "TW_THEME\|TARGET_SCREEN_WIDTH\|TARGET_SCREEN_HEIGHT" device/infinix/X6873/BoardConfig.mk
            echo
            echo "### what kati resolves"
            for v in TARGET_PRODUCT INTERNAL_PRODUCT TARGET_DEVICE TARGET_DEVICE_DIR TW_THEME TARGET_SCREEN_WIDTH TARGET_SCREEN_HEIGHT TARGET_RECOVERY_PIXEL_FORMAT PLATFORM_VERSION; do
              printf '%-32s = %s\n' "$v" "$(get_build_var $v 2>/dev/null)"
            done
            echo
            echo "### vendor/twrp present?"
            ls -la vendor/twrp/config/BoardConfigSoong.mk vendor/twrp/config/BoardConfigTWRP.mk 2>&1
            echo
            echo "### soong.variables twrp namespace"
            grep -iA6 '"twrpVarsPlugin"' out/soong/soong.variables 2>/dev/null | head -30 || echo "(no soong.variables yet)"
          } 2>&1 | tee $HOME/config-debug.log
          cat $HOME/config-debug.log >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------- build
      - name: Build
        id: build
        run: |
          cd /mnt/twrp
          set +e
          set -o pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh

          # lunch MUST NOT run in a pipeline. It is a shell function that
          # exports TARGET_PRODUCT; a pipeline runs it in a subshell, so the
          # banner prints but the exports are discarded and the following build
          # silently falls back to aosp_arm-eng. That was the real cause of
          # runs #1-#4: the theme failure and the generic_system artifact path
          # requirement were both symptoms of building the wrong product.
          # Use redirection, never a pipe.
          lunch twrp_X6873-eng > $HOME/lunch.log 2>&1
          cat $HOME/lunch.log

          # Refuse to build the wrong product.
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-<unset>}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-<unset>}"
          if [ "$TARGET_PRODUCT" != "twrp_X6873" ]; then
            echo "::error::lunch did not take effect (TARGET_PRODUCT='${TARGET_PRODUCT}'). Refusing to build."
            exit 1
          fi

          # The vendor_boot packaging rule invokes mkbootfs on this directory
          # even though this tree grafts the recovery fragment into the stock
          # image and deliberately does not build a replacement PLATFORM
          # fragment. Create the empty staging directory so that optional
          # intermediate does not emit "cannot open directory". The final
          # flashable image still takes PLATFORM from the stock image.
          mkdir -p out/target/product/X6873/vendor_ramdisk

          mka ${{ inputs.build_target }} -j$(nproc --all) 2>&1 | tee $HOME/build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> $GITHUB_OUTPUT
          exit "$rc"

      - name: Summarise errors
        if: always()
        run: |
          echo "## Build log tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 $HOME/build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## Distinct errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -iE "^(FAILED|error:|ninja: error|make: \*\*\*)| error: " $HOME/build.log 2>/dev/null \
            | sed 's/^[[:space:]]*//' | sort -u | head -n 40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la /mnt/twrp/out/target/product/X6873/*.img 2>/dev/null || echo "no images produced"

      # ------------------------------------------------------------- graft
      - name: Graft recovery fragment into stock vendor_boot
        if: always()
        run: |
          OUT=/mnt/twrp/out/target/product/X6873
          # Prefer the standalone recovery ramdisk if the build emitted one;
          # otherwise take the RECOVERY fragment out of the built vendor_boot.
          RAMDISK=""
          for c in "$OUT/ramdisk-recovery.img" "$OUT/ramdisk-recovery.cpio.lz4"; do
            [ -f "$c" ] && RAMDISK="$c" && break
          done
          if [ -z "$RAMDISK" ] && [ -f "$OUT/vendor_boot.img" ]; then
            python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
              unpack "$OUT/vendor_boot.img" $HOME/built_frags
            RAMDISK=$(ls $HOME/built_frags/vendor_ramdisk_*recovery 2>/dev/null | head -1)
            [ -z "$RAMDISK" ] && RAMDISK=$(ls $HOME/built_frags/vendor_ramdisk_* | head -1)
          fi
          if [ -z "$RAMDISK" ]; then
            echo "No recovery ramdisk was produced; nothing to graft." | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "using recovery ramdisk: $RAMDISK ($(stat -c%s "$RAMDISK") bytes)"

          curl -fsSL --retry 3 -o $HOME/stock_vendor_boot.img "${{ inputs.stock_vendor_boot_url }}"
          echo "stock image: $(stat -c%s $HOME/stock_vendor_boot.img) bytes"
          sha256sum $HOME/stock_vendor_boot.img

          # Refuse to proceed unless the stock image really has the expected
          # PLATFORM + RECOVERY layout.
          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            selftest $HOME/stock_vendor_boot.img | tee $HOME/selftest.log

          mkdir -p $HOME/artifact
          python3 "$GITHUB_WORKSPACE/device_tree/tools/vendor_boot_surgeon.py" \
            graft $HOME/stock_vendor_boot.img "$RAMDISK" \
            $HOME/artifact/vendor_boot-twrp-X6873.img | tee $HOME/graft.log

          cp /mnt/twrp/out/target/product/X6873/vendor_boot.img \
             $HOME/artifact/vendor_boot-RAW-DO-NOT-FLASH.img 2>/dev/null || true
          cd $HOME/artifact
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## Grafted image"
            echo '```'
            cat $HOME/graft.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # actions/upload-artifact expands neither "~" nor "$HOME" in path
      # patterns: they are matched literally. Runs #2-#5 uploaded nothing for
      # exactly that reason. Stage into the workspace and use relative paths.
      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p upload/logs
          cp -v $HOME/artifact/* upload/ 2>/dev/null || true
          for f in build.log lunch.log graft.log selftest.log config-debug.log \
                   built_vendor_boot_info.log; do
            cp -v "$HOME/$f" upload/logs/ 2>/dev/null || true
          done
          [ -f upload/logs/build.log ] && gzip -f upload/logs/build.log || true
          echo "--- staged ---"
          find upload -type f -printf '%p  %s bytes\n' || echo "(nothing staged)"
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X6873-vendor_boot-twrp
          path: upload/**
          if-no-files-found: warn
          retention-days: 30

      # --------------------------------------------------------- pixeldrain
      # Uploads ONLY the grafted recovery image, from the runner, so nothing
      # large crosses the maintainer's slow connection. Gives a direct,
      # resumable download link -- better than the artifact zip, which must be
      # fetched whole.
      - name: Upload image to pixeldrain
        if: always()
        env:
          PIXELDRAIN_KEY: ${{ secrets.PIXELDRAIN_KEY }}
        run: bash "$GITHUB_WORKSPACE/device_tree/tools/pixeldrain_upload.sh"

      # ------------------------------------------------------------ telegram
      # Sends the build report to Telegram. Uses repository variables TG_BOT
      # (bot token) and TG_CHAT (chat id) -- both optional; the step is skipped
      # entirely when they are not configured. The token is never printed and
      # never appears in a URL that gets logged.
      - name: Report to Telegram
        if: always()
        continue-on-error: true
        env:
          TG_BOT: ${{ secrets.TG_BOT || vars.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT || vars.TG_CHAT }}
        run: |
          if [ -z "$TG_BOT" ] || [ -z "$TG_CHAT" ]; then
            echo "TG_BOT / TG_CHAT not configured; skipping Telegram report."
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/device_tree/tools/tg_report.sh"
